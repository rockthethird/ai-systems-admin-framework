# AI Auditor Sudoers Commands Configuration
#
# This YAML file defines commands that the ai-auditor service account
# can execute with sudo privileges on monitored systems.
#
# Format: Each command specifies:
#   - name: Unique identifier (used in logs)
#   - path: Absolute path to executable
#   - args: Command-line arguments
#   - description: Purpose for audit trail
#
# WARNING: Any commands added here will be executable by ai-auditor via sudo.
# Only add commands that are safe for service execution. Manual testing required.
#

commands:
  - name: "system-info"
    path: "/usr/bin/uname"
    args: "-a"
    description: "Display system information (kernel, architecture, OS details)"

  - name: "ssh-inspect-sshd-effective"
    path: "/usr/sbin/sshd"
    args: "-T"
    description: "Inspect effective SSH daemon configuration"

  - name: "ssh-inspect-stat"
    path: "/usr/bin/stat"
    args: "-c %a %U %G %n /etc/ssh/sshd_config /etc/ssh/sshd_config.d/*.conf"
    description: "Check SSH config file permissions and ownership"

  - name: "ssh-inspect-cat"
    path: "/usr/bin/cat"
    args: "/etc/ssh/sshd_config /etc/ssh/sshd_config.d/*.conf"
    description: "Read SSH daemon configuration files"

  - name: "ssh-inspect-auth-methods"
    path: "/usr/bin/grep"
    args: "-E -H -e PasswordAuthentication -e PermitRootLogin -e PubkeyAuthentication /etc/ssh/sshd_config /etc/ssh/sshd_config.d/*.conf"
    description: "Check SSH authentication methods configuration"
