version: ai-auditor-collectors/v1

defaults:
  command_timeout_seconds: 10
  max_items: 5000
  max_stream_bytes: 1048576
  max_cpu_seconds: 5
  max_open_files: 256
  max_file_bytes: 1048576

collectors:
  - id: host-uptime
    type: command
    candidates:
      - path: /usr/bin/uptime
        args: [-p]
      - path: /bin/uptime
        args: [-p]
    parser: lines
    max_items: 10

  - id: filesystems
    type: command
    candidates:
      - path: /usr/bin/df
        args: [-P, -T]
      - path: /bin/df
        args: [-P, -T]
    parser: lines

  - id: network-interfaces
    type: command
    candidates:
      - path: /usr/sbin/ip
        args: [-details, address]
      - path: /sbin/ip
        args: [-details, address]
    parser: lines

  - id: network-routes
    type: command
    candidates:
      - path: /usr/sbin/ip
        args: [route, show, table, all]
      - path: /sbin/ip
        args: [route, show, table, all]
    parser: lines

  - id: network-listening-sockets
    type: command
    candidates:
      - path: /usr/bin/ss
        args: [-H, -lntup]
      - path: /bin/ss
        args: [-H, -lntup]
    parser: lines

  - id: systemd-failed-units
    type: command
    candidates:
      - path: /usr/bin/systemctl
        args: [--no-pager, --plain, --failed]
      - path: /bin/systemctl
        args: [--no-pager, --plain, --failed]
    parser: lines

  - id: systemd-timers
    type: command
    candidates:
      - path: /usr/bin/systemctl
        args: [--no-pager, --plain, list-timers, --all]
      - path: /bin/systemctl
        args: [--no-pager, --plain, list-timers, --all]
    parser: lines

  - id: systemd-enabled-units
    type: command
    candidates:
      - path: /usr/bin/systemctl
        args: [--no-pager, --plain, list-unit-files, --state=enabled]
      - path: /bin/systemctl
        args: [--no-pager, --plain, list-unit-files, --state=enabled]
    parser: lines

  - id: packages
    type: command
    candidates:
      - path: /usr/bin/dpkg-query
        args: [-W, '-f=${binary:Package}\t${Version}\n']
      - path: /usr/bin/rpm
        args: [-qa]
      - path: /bin/rpm
        args: [-qa]
    parser: lines

  - id: containers
    type: command
    optional: true
    candidates:
      - path: /usr/bin/docker
        args: [ps, --all, --no-trunc, --format, '{{json .}}']
      - path: /usr/local/bin/docker
        args: [ps, --all, --no-trunc, --format, '{{json .}}']
    parser: lines

  - id: accounts
    type: builtin
    primitive: passwd-entries

  - id: host-platform
    type: builtin
    primitive: host-platform

  - id: os-release
    type: builtin
    primitive: os-release

  - id: ssh-effective-settings
    type: builtin
    primitive: ssh-effective-settings
    parameters:
      users: [ai-auditor-cloud, ai-auditor-local]
      settings:
        - passwordauthentication
        - kbdinteractiveauthentication
        - pubkeyauthentication
        - permitrootlogin
      executable_paths: [/usr/sbin/sshd, /sbin/sshd]

  - id: auditor-account-paths
    type: builtin
    primitive: account-path-metadata
    parameters:
      users: [ai-auditor-cloud, ai-auditor-local]
      relative_paths: [.ssh/authorized_keys]

  - id: report-endpoints
    type: builtin
    primitive: path-metadata
    parameters:
      paths:
        - /opt/ai-auditor/bin/report-external
        - /opt/ai-auditor/bin/report-internal

  - id: scheduled-task-paths
    type: builtin
    primitive: path-metadata
    parameters:
      paths:
        - /etc/crontab
        - /etc/cron.d
        - /etc/cron.daily
        - /etc/cron.hourly
        - /etc/cron.weekly
        - /etc/cron.monthly
